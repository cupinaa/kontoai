<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KontoAI — logo</title>
  <link rel="icon" href="/static/logo/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f5f6f8; --surface: #fff; --line: #e8eaee; --text: #1d1f23; --text-2: #5d636d;
      --gray: #c9ced5; --blue: #0a84ff; --ink: #3c4650;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
    main { max-width: 1080px; margin: 0 auto; padding: 56px 24px 72px; }
    h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 650; }
    .sub { color: var(--text-2); margin: 0 0 36px; max-width: 620px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .card { border-radius: 18px; padding: 40px 36px; display: flex; flex-direction: column; gap: 36px; border: 1px solid var(--line); }
    .light { background: var(--surface); }
    .dark { background: #16181c; border-color: #16181c; }
    .label { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }
    .dark .label { color: #9aa1ab; }

    .logo { display: inline-flex; align-items: center; }
    .mark { display: block; flex: none; }
    .word { font-weight: 500; letter-spacing: -0.02em; color: var(--ink); line-height: 1; }
    .word b { color: var(--blue); font-weight: 500; }
    .dark .word { color: #e6e9ed; }

    .xl .mark { width: 110px; height: 22px; } .xl { gap: 18px; } .xl .word { font-size: 52px; }
    .md .mark { width: 40px; height: 8px; } .md { gap: 10px; } .md .word { font-size: 19px; }
    .sm .mark { width: 30px; height: 6px; } .sm { gap: 8px; } .sm .word { font-size: 14px; }

    .row { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
    .fav { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
    .dark .fav { color: #9aa1ab; }
    .tile { display: grid; place-items: center; border-radius: 8px; background: var(--bg); padding: 10px; }
    .dark .tile { background: #23262c; }
    .tile img { display: block; }

    .meaning { margin-top: 28px; display: flex; align-items: center; gap: 14px; color: var(--text-2); font-size: 14px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .xl .word { font-size: 40px; } }
  </style>
</head>
<body>
  <main>
    <h1>Logo</h1>
    <p class="sub">Četiri cifre konta: prve tri daje knjigovodstveni program, četvrtu — analitiku — KontoAI.</p>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="mark" viewBox="0 0 30 6">
        <rect x="0" y="0" width="6" height="6" rx="1.5" fill="#C9CED5"/>
        <rect x="8" y="0" width="6" height="6" rx="1.5" fill="#C9CED5"/>
        <rect x="16" y="0" width="6" height="6" rx="1.5" fill="#C9CED5"/>
        <rect x="24" y="0" width="6" height="6" rx="1.5" fill="#0A84FF"/>
      </symbol>
    </svg>

    <div class="grid">
      <section class="card light">
        <span class="label">Bela pozadina</span>
        <span class="logo xl"><svg class="mark"><use href="#mark"/></svg><span class="word">konto<b>ai</b></span></span>
        <span class="logo md"><svg class="mark"><use href="#mark"/></svg><span class="word">konto<b>ai</b></span></span>
        <span class="logo sm"><svg class="mark"><use href="#mark"/></svg><span class="word">konto<b>ai</b></span></span>
        <div class="row">
          <div class="fav"><div class="tile"><img src="/static/logo/favicon.svg" width="48" height="48" alt=""></div>48</div>
          <div class="fav"><div class="tile"><img src="/static/logo/favicon.svg" width="32" height="32" alt=""></div>32</div>
          <div class="fav"><div class="tile"><img src="/static/logo/favicon.svg" width="16" height="16" alt=""></div>16</div>
        </div>
      </section>

      <section class="card dark">
        <span class="label">Tamna pozadina</span>
        <span class="logo xl"><svg class="mark"><use href="#mark"/></svg><span class="word">konto<b>ai</b></span></span>
        <span class="logo md"><svg class="mark"><use href="#mark"/></svg><span class="word">konto<b>ai</b></span></span>
        <span class="logo sm"><svg class="mark"><use href="#mark"/></svg><span class="word">konto<b>ai</b></span></span>
        <div class="row">
          <div class="fav"><div class="tile"><img src="/static/logo/favicon.svg" width="48" height="48" alt=""></div>48</div>
          <div class="fav"><div class="tile"><img src="/static/logo/favicon.svg" width="32" height="32" alt=""></div>32</div>
          <div class="fav"><div class="tile"><img src="/static/logo/favicon.svg" width="16" height="16" alt=""></div>16</div>
        </div>
      </section>
    </div>

    <p class="meaning">
      <svg class="mark" width="40" height="8" aria-hidden="true"><use href="#mark"/></svg>
      Znak bez teksta je i favicon.
    </p>
  </main>
</body>
</html>
